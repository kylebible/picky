name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  preview:
    # Uploads a version without deploying it and prints its preview URL.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Upload preview
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets aren't set yet, so no preview was uploaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'ANTHROPIC_API_KEY=\n' > .secrets.env
          if ! npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --secrets-file .secrets.env > upload.log 2>&1; then
            cat upload.log
            # Surface the error as an annotation so it's readable without the full log.
            echo "::error title=wrangler versions upload failed::$(tail -n 25 upload.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            if grep -qiE "10007|does not exist" upload.log; then
              echo "The Worker doesn't exist until the first deploy to main, so there's no preview yet." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          cat upload.log
          grep -o 'https://[^ ]*workers.dev' upload.log | tail -1 | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Deploy Worker
        run: |
          printf 'ANTHROPIC_API_KEY=\n' > .secrets.env
          npx wrangler deploy --secrets-file .secrets.env
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply picky --remote
