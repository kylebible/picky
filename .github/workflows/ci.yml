name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  preview:
    # Uploads a version without deploying it and prints its preview URL.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Upload preview
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets aren't set yet, so no preview was uploaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Upload the Anthropic key only when the GitHub secret is set, so a
          # missing secret never blanks the Worker's existing one.
          secret_args=()
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            jq -n --arg key "$ANTHROPIC_API_KEY" '{ANTHROPIC_API_KEY: $key}' > .secrets.json
            secret_args=(--secrets-file .secrets.json)
          else
            echo "::warning title=ANTHROPIC_API_KEY not set::The Worker's Anthropic key was left unchanged."
          fi
          if ! npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" "${secret_args[@]}" > upload.log 2>&1; then
            cat upload.log
            if grep -qiE "10007|does not (yet )?exist" upload.log; then
              echo "::notice title=No preview yet::The Worker is created by the first deploy to main; previews start after that."
              exit 0
            fi
            # Surface the error as an annotation so it's readable without the full log.
            echo "::error title=wrangler versions upload failed::$(tail -n 25 upload.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat upload.log
          grep -o 'https://[^ ]*workers.dev' upload.log | tail -1 | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Deploy Worker
        run: |
          # Upload the Anthropic key only when the GitHub secret is set, so a
          # missing secret never blanks the Worker's existing one.
          secret_args=()
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            jq -n --arg key "$ANTHROPIC_API_KEY" '{ANTHROPIC_API_KEY: $key}' > .secrets.json
            secret_args=(--secrets-file .secrets.json)
          else
            echo "::warning title=ANTHROPIC_API_KEY not set::The Worker's Anthropic key was left unchanged."
          fi
          if ! npx wrangler deploy "${secret_args[@]}" > deploy.log 2>&1; then
            cat deploy.log
            echo "::error title=wrangler deploy failed::$(tail -n 25 deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat deploy.log
      - name: Apply database migrations
        run: |
          if ! npx wrangler d1 migrations apply picky --remote > migrate.log 2>&1; then
            cat migrate.log
            echo "::error title=D1 migrations failed::$(tail -n 25 migrate.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat migrate.log
