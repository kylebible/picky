<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1E8E5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Picky</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app's script fails to load or run, show something instead of a blank page.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<main style="padding:24px;font-family:system-ui;line-height:1.4"><h1>Picky didn\'t load</h1>' +
            "<p>Check your connection, then reload.</p>" +
            '<button onclick="location.reload()" style="font-size:16px;padding:10px 16px">Reload</button></main>';
          try {
            navigator.sendBeacon(
              "/api/events",
              JSON.stringify({ session_id: "boot", events: [{ kind: "error", name: "boot", path: location.pathname, data: {} }] }),
            );
          } catch (e) {}
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
